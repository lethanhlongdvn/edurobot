<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điểm Tiếng Việt - EduRobot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="../css/index.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-bounce-in { animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        @keyframes bounceIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen">
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <!-- Content injected by DashboardUI -->
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard" class="hidden max-w-[1600px] mx-auto p-4 md:p-8">
        <!-- Header -->
        <div id="teacher-header"></div>

        <!-- Chart Section -->
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl shadow-gray-200/50 border border-gray-50 mb-10">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-10">
                <h2 class="text-xl font-black text-gray-800 flex items-center gap-3">
                    <div class="w-2 h-8 bg-indigo-500 rounded-full"></div>
                    Phân bổ điểm số
                </h2>
                <select id="chart-data-filter" class="bg-gray-50 border-0 rounded-2xl px-6 py-3 font-bold text-gray-700 outline-none ring-2 ring-transparent focus:ring-blue-500 transition-all cursor-pointer">
                    <option value="avgScore">Điểm trung bình</option>
                    <option value="luyenTapScore">Điểm Luyện tập</option>
                    <option value="cungCoScore">Điểm Củng cố</option>
                </select>
            </div>
            <div class="h-[400px]">
                <canvas id="score-chart"></canvas>
            </div>
        </div>

        <!-- Filters Bento -->
        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl shadow-blue-100/50 border border-blue-50 mb-8">
            <div class="flex flex-col lg:flex-row items-center gap-6">
                <div class="flex items-center gap-3 shrink-0">
                    <div class="w-10 h-10 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                    </div>
                    <h3 class="text-lg font-black text-gray-800 uppercase tracking-tight">Bộ lọc</h3>
                </div>
                
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 w-full">
                    <select id="week-filter" class="w-full bg-gray-50 border-0 rounded-2xl p-4 font-bold text-gray-700 outline-none ring-2 ring-transparent focus:ring-blue-500 transition-all cursor-pointer">
                        <option value="">-- Tất cả Tuần --</option>
                    </select>
                    <select id="period-filter" class="w-full bg-gray-50 border-0 rounded-2xl p-4 font-bold text-gray-700 outline-none ring-2 ring-transparent focus:ring-blue-500 transition-all cursor-pointer">
                        <option value="">-- Tất cả Tiết --</option>
                    </select>
                    <select id="school-filter" class="w-full bg-gray-50 border-0 rounded-2xl p-4 font-bold text-gray-700 outline-none ring-2 ring-transparent focus:ring-blue-500 transition-all cursor-pointer">
                        <option value="">-- Tất cả Trường --</option>
                    </select>
                    <select id="class-filter" class="w-full bg-gray-50 border-0 rounded-2xl p-4 font-bold text-gray-700 outline-none ring-2 ring-transparent focus:ring-blue-500 transition-all cursor-pointer">
                        <option value="">-- Tất cả Lớp --</option>
                    </select>
                    <button id="btn-export" onclick="window.exportToExcel()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-2xl shadow-lg transition-all transform active:scale-95 uppercase tracking-widest flex items-center justify-center gap-2 text-xs">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Xuất Excel
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Bento -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-blue-100/50 border border-blue-50 flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-50 rounded-full group-hover:scale-150 transition-transform duration-700 opacity-60"></div>
                <div class="text-blue-500 mb-4 z-10">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">Lượt nộp bài</p>
                    <h2 id="stat-total" class="text-4xl font-black text-gray-800">0</h2>
                </div>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-green-100/50 border border-green-50 flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-green-50 rounded-full group-hover:scale-150 transition-transform duration-700 opacity-60"></div>
                <div class="text-green-500 mb-4 z-10">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </div>
                <div>
                    <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">Sĩ số tham gia</p>
                    <h2 id="stat-students" class="text-4xl font-black text-gray-800">0</h2>
                </div>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-purple-100/50 border border-purple-50 flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-purple-50 rounded-full group-hover:scale-150 transition-transform duration-700 opacity-60"></div>
                <div class="text-purple-500 mb-4 z-10">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                </div>
                <div>
                    <p class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">Điểm TB Lớp</p>
                    <h2 id="stat-avg" class="text-4xl font-black text-gray-800">0</h2>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-[3rem] shadow-2xl shadow-gray-200/50 border border-gray-50 overflow-hidden mb-10">
            <div class="p-8 border-b border-gray-50 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-xl font-black text-gray-800 flex items-center gap-3">
                    <div class="w-2 h-8 bg-blue-500 rounded-full"></div>
                    Danh sách chi tiết
                </h2>
                <div id="loading-indicator" class="hidden flex items-center gap-2 text-blue-500 font-bold">
                    <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Đang đồng bộ dữ liệu...
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50/50">
                        <tr>
                            <!-- Headers dynamically rendered -->
                        </tr>
                    </thead>
                    <tbody id="results-table" class="divide-y divide-gray-100">
                        <!-- Content dynamically rendered -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { DashboardUI } from '../js/dashboard/dashboard-ui.js';
        import { 
            populateFilters, 
            updatePeriodDropdown, 
            handlePeriodFilterChange, 
            initRealtime, 
            renderStats,
            sortTableBy,
            exportToExcel,
            renderScoreChart
        } from '../js/dashboard/vietnamese-dashboard.js';

        // Bind global functions for HTML attributes
        window.sortTableBy = sortTableBy;
        window.exportToExcel = exportToExcel;

        // Configuration for Vietnamese Dashboard
        const config = {
            title: "Kết quả Tiếng Việt",
            theme: "blue",
            icon: `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18 18.246 18.477 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>`,
            populateFilters,
            initRealtime,
            extraButtonsHtml: `
                <a href="teacher-toan.html" class="bg-white text-gray-500 hover:text-orange-600 font-black px-6 py-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3 transition-all transform hover:-translate-y-1 active:scale-95 text-xs uppercase tracking-widest">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                    DASHBOARD TOÁN
                </a>
                <a href="teacher-lichsu.html" class="bg-white text-gray-500 hover:text-amber-600 font-black px-6 py-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3 transition-all transform hover:-translate-y-1 active:scale-95 text-xs uppercase tracking-widest">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    DASHBOARD LỊCH SỬ
                </a>
                <a href="teacher-khoahoc.html" class="bg-white text-gray-500 hover:text-emerald-600 font-black px-6 py-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3 transition-all transform hover:-translate-y-1 active:scale-95 text-xs uppercase tracking-widest">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    DASHBOARD KHOA HỌC
                </a>
            `
        };

        // Initialize App
        DashboardUI.initDashboardApp(config);

        // Event Listeners
        document.getElementById('week-filter')?.addEventListener('change', (e) => {
            updatePeriodDropdown(e.target.value);
            renderStats();
        });
        document.getElementById('period-filter')?.addEventListener('change', handlePeriodFilterChange);
        document.getElementById('school-filter')?.addEventListener('change', renderStats);
        document.getElementById('class-filter')?.addEventListener('change', renderStats);
        document.getElementById('chart-data-filter')?.addEventListener('change', () => renderScoreChart());
    </script>
</body>
</html>

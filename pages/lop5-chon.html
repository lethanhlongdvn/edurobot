<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lớp 5 Chọn — EduRobot</title>
    <meta name="description" content="Quản lý danh sách Lớp 5 Chọn cho chuyên đề và thao giảng.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { font-family: 'Nunito', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255,255,255,0.03);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .student-row { transition: all 0.2s ease; }
        .student-row:hover { background: rgba(255,255,255,0.05); }
        .student-row.selected { background: rgba(234,179,8,0.08); border-left: 3px solid #eab308; }
        .tab-active { background: rgba(234,179,8,0.15); color: #fbbf24; border-color: #eab308; }
        .tab-inactive { color: #64748b; border-color: transparent; }
        .tab-inactive:hover { color: #94a3b8; }
        .badge-selected { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #422006; }
        .badge-class { background: rgba(99,102,241,0.2); color: #a5b4fc; }
        .btn-save {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #422006;
            transition: all 0.2s;
        }
        .btn-save:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(234,179,8,0.3); }
        .btn-remove {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            transition: all 0.2s;
        }
        .btn-remove:hover { background: rgba(239,68,68,0.3); }
        .checkbox-custom {
            appearance: none;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .checkbox-custom:checked {
            background: #eab308;
            border-color: #eab308;
        }
        .checkbox-custom:checked::after {
            content: '✓';
            position: absolute;
            top: -2px; left: 2px;
            font-size: 13px;
            font-weight: 900;
            color: #422006;
        }
        .search-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: #eab308;
            box-shadow: 0 0 0 3px rgba(234,179,8,0.1);
        }
        .counter-badge {
            background: rgba(234,179,8,0.2);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 999px;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease forwards; }
    </style>
</head>

<body class="p-4 md:p-8 text-slate-200">

    <!-- ====== HEADER ====== -->
    <div class="max-w-6xl mx-auto mb-8">
        <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-4">
                <a href="admin.html" class="text-slate-400 hover:text-white transition text-sm font-black">← Admin</a>
                <div>
                    <h1 class="text-2xl font-black text-white flex items-center gap-2">⭐ Lớp 5 Chọn</h1>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-0.5">Chuyên đề & Thao giảng</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="admin-name" class="text-sm font-bold text-slate-400"></span>
                <button onclick="exportSelectedToExcel()" id="btn-export"
                    class="bg-emerald-600 hover:bg-emerald-500 transition-all rounded-xl px-4 py-2.5 text-xs font-black flex items-center gap-2 text-white">
                    📊 Xuất Excel
                </button>
            </div>
        </div>
    </div>

    <!-- ====== STATS ====== -->
    <div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="glass-card rounded-2xl p-5 text-center">
            <div class="text-3xl font-black text-white" id="stat-total">0</div>
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mt-1">Tổng HS khối 5</div>
        </div>
        <div class="glass-card rounded-2xl p-5 text-center">
            <div class="text-3xl font-black text-yellow-400" id="stat-selected">0</div>
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mt-1">Đã chọn</div>
        </div>
        <div class="glass-card rounded-2xl p-5 text-center">
            <div class="text-3xl font-black text-slate-400" id="stat-remaining">0</div>
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mt-1">Chưa chọn</div>
        </div>
        <div class="glass-card rounded-2xl p-5 text-center">
            <div class="text-3xl font-black text-indigo-400" id="stat-classes">0</div>
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mt-1">Số lớp</div>
        </div>
    </div>

    <!-- ====== TABS + FILTERS ====== -->
    <div class="max-w-6xl mx-auto mb-4">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <!-- Tabs -->
            <div class="flex gap-2">
                <button id="tab-all" onclick="switchTab('all')" class="px-5 py-2.5 rounded-xl font-black text-sm border-2 transition-all tab-active">
                    📋 Danh sách chung
                </button>
                <button id="tab-selected" onclick="switchTab('selected')" class="px-5 py-2.5 rounded-xl font-black text-sm border-2 transition-all tab-inactive">
                    ⭐ Đã chọn <span id="tab-selected-count" class="counter-badge ml-1">0</span>
                </button>
            </div>
            <!-- Filters -->
            <div class="flex flex-wrap gap-3 items-center">
                <select id="class-filter" onchange="renderTable()" title="Lọc theo lớp"
                    class="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm font-bold text-slate-300 outline-none cursor-pointer">
                    <option value="">Tất cả lớp</option>
                </select>
                <select id="school-filter" onchange="renderTable()" title="Lọc theo trường"
                    class="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm font-bold text-slate-300 outline-none cursor-pointer">
                    <option value="">Tất cả trường</option>
                </select>
                <input type="text" id="search-input" placeholder="🔍 Tìm theo tên..."
                    oninput="renderTable()"
                    class="search-input rounded-xl px-4 py-2 text-sm font-bold text-white outline-none w-48">
            </div>
        </div>
    </div>

    <!-- ====== MAIN TABLE ====== -->
    <div class="max-w-6xl mx-auto">
        <div class="glass-card rounded-3xl overflow-hidden">
            <!-- Toolbar -->
            <div class="px-6 py-4 border-b border-white/5 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-2 cursor-pointer text-sm font-bold text-slate-400 hover:text-white transition">
                        <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this.checked)" class="checkbox-custom">
                        Chọn tất cả
                    </label>
                    <span id="selection-info" class="text-xs font-bold text-slate-600"></span>
                </div>
                <div class="flex gap-2">
                    <!-- Nút hiện khi tab "all" -->
                    <button id="btn-add-selected" onclick="addSelectedStudents()" class="hidden btn-save px-5 py-2 rounded-xl text-sm font-black">
                        ⭐ Thêm vào Lớp 5 Chọn
                    </button>
                    <!-- Nút hiện khi tab "selected" -->
                    <button id="btn-remove-selected" onclick="removeSelectedStudents()" class="hidden btn-remove px-5 py-2 rounded-xl text-sm font-black">
                        ❌ Cho thôi hàng loạt
                    </button>
                    <button onclick="saveToFirestore()" class="btn-save px-5 py-2 rounded-xl text-sm font-black">
                        💾 Lưu lên Firebase
                    </button>
                </div>
            </div>
            <!-- Table Header -->
            <div class="hidden md:grid grid-cols-12 gap-4 px-6 py-3 text-[10px] font-black text-slate-500 uppercase tracking-widest border-b border-white/5">
                <div class="col-span-1 text-center">Chọn</div>
                <div class="col-span-1 text-center">TT</div>
                <div class="col-span-3">Họ và tên</div>
                <div class="col-span-2">Lớp</div>
                <div class="col-span-3">Trường</div>
                <div class="col-span-2 text-right">Trạng thái</div>
            </div>
            <!-- Table Body -->
            <div id="student-list" class="divide-y divide-white/5">
                <div class="text-center py-16 text-slate-500 fade-in">
                    <div class="text-4xl mb-3">⏳</div>
                    <p class="font-bold text-sm">Đang tải danh sách học sinh...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== TOAST ====== -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 space-y-3"></div>

    <!-- ====== SCRIPTS ====== -->
    <script src="../js/core/firebase-config.js?v=2.8"></script>
    <script src="../js/core/firebase-logic.js"></script>
    <script>
        // ========== STATE ==========
        let allStudents = [];       // All grade-5 students from Firestore
        let selectedIds = new Set(); // Student UIDs in Lớp 5 Chọn
        let currentTab = 'all';     // 'all' or 'selected'
        let checkboxStates = {};    // Temporary checkbox states for batch actions

        // ========== AUTH GUARD ==========
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = 'auth.html'; return; }
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (!doc.exists) { window.location.href = 'auth.html'; return; }
                const data = doc.data();
                if (data.role !== 'admin' && data.role !== 'teacher') {
                    alert('Bạn không có quyền truy cập trang này.');
                    window.location.href = 'index.html';
                    return;
                }
                if (!data.approved) {
                    alert('Tài khoản chưa được duyệt.');
                    window.location.href = 'auth.html';
                    return;
                }
                document.getElementById('admin-name').textContent = `${data.role === 'admin' ? '👑' : '👩‍🏫'} ${data.displayName || data.name || 'Giáo viên'}`;
                loadData();
            } catch (e) {
                console.error('Auth error:', e);
                window.location.href = 'auth.html';
            }
        });

        // ========== LOAD DATA ==========
        async function loadData() {
            try {
                // 1. Load all grade-5 students
                const snapshot = await db.collection('users')
                    .where('role', 'in', ['student', 'hoc-sinh', 'hocsinh'])
                    .get();

                allStudents = [];
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const cls = d.studentClass || d.className || d.lop || d.grade || '';
                    // Only grade 5 students
                    if (cls.startsWith('5')) {
                        allStudents.push({
                            id: doc.id,
                            name: d.displayName || d.name || d.studentName || 'N/A',
                            studentClass: cls,
                            school: d.school || d.studentSchool || '',
                            email: d.email || ''
                        });
                    }
                });

                // Sort by class, then name
                allStudents.sort((a, b) => {
                    if (a.studentClass !== b.studentClass) return a.studentClass.localeCompare(b.studentClass);
                    return a.name.localeCompare(b.name);
                });

                // 2. Load existing Lớp 5 Chọn list
                const selectedDoc = await db.collection('lop5chon').doc('active').get();
                selectedIds = new Set();
                if (selectedDoc.exists) {
                    const data = selectedDoc.data();
                    if (data.studentIds && Array.isArray(data.studentIds)) {
                        data.studentIds.forEach(id => selectedIds.add(id));
                    }
                }

                // 3. Populate filters
                populateFilters();

                // 4. Render
                updateStats();
                renderTable();

            } catch (e) {
                console.error('Load error:', e);
                showToast('❌ Lỗi tải dữ liệu: ' + e.message);
            }
        }

        // ========== FILTERS ==========
        function populateFilters() {
            const classSet = new Set();
            const schoolSet = new Set();
            allStudents.forEach(s => {
                if (s.studentClass) classSet.add(s.studentClass);
                if (s.school) schoolSet.add(s.school);
            });

            const classFilter = document.getElementById('class-filter');
            classFilter.innerHTML = '<option value="">Tất cả lớp</option>';
            Array.from(classSet).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = c;
                classFilter.appendChild(opt);
            });

            const schoolFilter = document.getElementById('school-filter');
            schoolFilter.innerHTML = '<option value="">Tất cả trường</option>';
            Array.from(schoolSet).sort().forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                schoolFilter.appendChild(opt);
            });
        }

        // ========== TABS ==========
        function switchTab(tab) {
            currentTab = tab;
            checkboxStates = {};
            document.getElementById('select-all-checkbox').checked = false;

            ['all', 'selected'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                el.className = t === tab
                    ? 'px-5 py-2.5 rounded-xl font-black text-sm border-2 transition-all tab-active'
                    : 'px-5 py-2.5 rounded-xl font-black text-sm border-2 transition-all tab-inactive';
            });

            // Show/hide action buttons
            document.getElementById('btn-add-selected').classList.toggle('hidden', tab !== 'all');
            document.getElementById('btn-remove-selected').classList.toggle('hidden', tab !== 'selected');

            renderTable();
        }

        // ========== STATS ==========
        function updateStats() {
            const total = allStudents.length;
            const selected = selectedIds.size;
            const remaining = total - selected;
            const classes = new Set(allStudents.map(s => s.studentClass)).size;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-selected').textContent = selected;
            document.getElementById('stat-remaining').textContent = remaining;
            document.getElementById('stat-classes').textContent = classes;
            document.getElementById('tab-selected-count').textContent = selected;
        }

        // ========== RENDER TABLE ==========
        function renderTable() {
            const container = document.getElementById('student-list');
            const classF = document.getElementById('class-filter').value;
            const schoolF = document.getElementById('school-filter').value;
            const searchQ = document.getElementById('search-input').value.trim().toLowerCase();

            let list = allStudents;

            // Filter by tab
            if (currentTab === 'selected') {
                list = list.filter(s => selectedIds.has(s.id));
            }

            // Filter by class
            if (classF) list = list.filter(s => s.studentClass === classF);
            // Filter by school
            if (schoolF) list = list.filter(s => s.school === schoolF);
            // Filter by search
            if (searchQ) list = list.filter(s => s.name.toLowerCase().includes(searchQ));

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-500 fade-in">
                        <div class="text-4xl mb-3">${currentTab === 'selected' ? '📭' : '🔍'}</div>
                        <p class="font-bold text-sm">${currentTab === 'selected' ? 'Chưa có học sinh nào trong Lớp 5 Chọn.' : 'Không tìm thấy học sinh phù hợp.'}</p>
                    </div>`;
                updateSelectionInfo(0);
                return;
            }

            let stt = 0;
            container.innerHTML = list.map(s => {
                stt++;
                const isSelected = selectedIds.has(s.id);
                const isChecked = checkboxStates[s.id] || false;
                const rowClass = isSelected ? 'student-row selected' : 'student-row';

                const statusBadge = isSelected
                    ? '<span class="badge-selected px-2 py-0.5 rounded-lg text-[10px] font-black uppercase">⭐ Đã chọn</span>'
                    : '<span class="px-2 py-0.5 rounded-lg text-[10px] font-black uppercase bg-white/5 text-slate-500">Chưa chọn</span>';

                const actionBtn = currentTab === 'selected'
                    ? `<button onclick="removeSingleStudent('${s.id}')" class="btn-remove px-2 py-1 rounded-lg text-[10px] font-black ml-2" title="Cho thôi">❌</button>`
                    : (isSelected
                        ? `<button onclick="removeSingleStudent('${s.id}')" class="btn-remove px-2 py-1 rounded-lg text-[10px] font-black ml-2" title="Bỏ chọn">✕</button>`
                        : `<button onclick="addSingleStudent('${s.id}')" class="bg-yellow-500/10 border border-yellow-500/20 text-yellow-300 px-2 py-1 rounded-lg text-[10px] font-black ml-2 hover:bg-yellow-500/20 transition" title="Chọn">⭐</button>`);

                return `
                    <div class="${rowClass} px-6 py-3 grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-4 items-center fade-in" data-id="${s.id}">
                        <div class="col-span-1 text-center">
                            <input type="checkbox" class="checkbox-custom row-checkbox" data-id="${s.id}" ${isChecked ? 'checked' : ''} onchange="toggleCheckbox('${s.id}', this.checked)">
                        </div>
                        <div class="col-span-1 text-center text-slate-600 font-black text-sm">${stt}</div>
                        <div class="col-span-3">
                            <div class="font-black text-white text-sm">${s.name}</div>
                            <div class="text-[10px] text-slate-600 font-mono">${s.email ? s.email.split('@')[0] : ''}</div>
                        </div>
                        <div class="col-span-2">
                            <span class="badge-class px-2 py-0.5 rounded-lg text-[10px] font-black">${s.studentClass}</span>
                        </div>
                        <div class="col-span-3 text-xs font-bold text-slate-500">${s.school}</div>
                        <div class="col-span-2 text-right flex items-center justify-end gap-1">
                            ${statusBadge}${actionBtn}
                        </div>
                    </div>`;
            }).join('');

            updateSelectionInfo(list.length);
        }

        // ========== CHECKBOX LOGIC ==========
        function toggleCheckbox(id, checked) {
            checkboxStates[id] = checked;
            updateSelectionInfo();
        }

        function toggleSelectAll(checked) {
            // Get currently visible rows
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = checked;
                checkboxStates[cb.dataset.id] = checked;
            });
            updateSelectionInfo();
        }

        function updateSelectionInfo(total) {
            const checkedCount = Object.values(checkboxStates).filter(v => v).length;
            const info = document.getElementById('selection-info');
            if (checkedCount > 0) {
                info.textContent = `${checkedCount} học sinh đang được tích`;
                info.className = 'text-xs font-bold text-yellow-400';
            } else {
                info.textContent = '';
            }
        }

        // ========== ADD / REMOVE ==========
        function addSingleStudent(id) {
            selectedIds.add(id);
            updateStats();
            renderTable();
            showToast('⭐ Đã thêm vào Lớp 5 Chọn');
        }

        function removeSingleStudent(id) {
            if (!confirm('Xác nhận cho học sinh này thôi khỏi Lớp 5 Chọn?')) return;
            selectedIds.delete(id);
            updateStats();
            renderTable();
            showToast('❌ Đã cho thôi khỏi Lớp 5 Chọn');
        }

        function addSelectedStudents() {
            const ids = Object.entries(checkboxStates).filter(([_, v]) => v).map(([k]) => k);
            if (ids.length === 0) { showToast('⚠️ Chưa tích chọn học sinh nào!'); return; }

            ids.forEach(id => selectedIds.add(id));
            checkboxStates = {};
            document.getElementById('select-all-checkbox').checked = false;
            updateStats();
            renderTable();
            showToast(`⭐ Đã thêm ${ids.length} học sinh vào Lớp 5 Chọn`);
        }

        function removeSelectedStudents() {
            const ids = Object.entries(checkboxStates).filter(([_, v]) => v).map(([k]) => k);
            if (ids.length === 0) { showToast('⚠️ Chưa tích chọn học sinh nào!'); return; }
            if (!confirm(`Xác nhận cho ${ids.length} học sinh thôi khỏi Lớp 5 Chọn?`)) return;

            ids.forEach(id => selectedIds.delete(id));
            checkboxStates = {};
            document.getElementById('select-all-checkbox').checked = false;
            updateStats();
            renderTable();
            showToast(`❌ Đã cho ${ids.length} học sinh thôi khỏi Lớp 5 Chọn`);
        }

        // ========== SAVE TO FIRESTORE ==========
        async function saveToFirestore() {
            try {
                const btn = event.currentTarget;
                const original = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '⏳ Đang lưu...';

                await db.collection('lop5chon').doc('active').set({
                    studentIds: Array.from(selectedIds),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedBy: firebase.auth().currentUser?.email || 'unknown',
                    totalStudents: selectedIds.size
                });

                showToast(`✅ Đã lưu ${selectedIds.size} học sinh vào Lớp 5 Chọn!`);
                btn.disabled = false;
                btn.innerHTML = original;
            } catch (e) {
                console.error('Save error:', e);
                showToast('❌ Lỗi khi lưu: ' + e.message);
            }
        }

        // ========== EXPORT EXCEL ==========
        function exportSelectedToExcel() {
            const selectedStudents = allStudents.filter(s => selectedIds.has(s.id));
            if (selectedStudents.length === 0) {
                showToast('⚠️ Chưa có học sinh nào trong Lớp 5 Chọn!');
                return;
            }

            const data = selectedStudents.map((s, i) => ({
                'TT': i + 1,
                'Họ và Tên': s.name,
                'Lớp': "'" + s.studentClass,
                'Trường': s.school,
                'Email': s.email
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            ws['!cols'] = [{ wch: 5 }, { wch: 28 }, { wch: 8 }, { wch: 30 }, { wch: 36 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Lớp 5 Chọn');

            const dateStr = new Date().toLocaleDateString('vi-VN').replace(/\//g, '-');
            XLSX.writeFile(wb, `Lop_5_Chon_${dateStr}.xlsx`);
            showToast('📊 Đã xuất file Excel!');
        }

        // ========== TOAST ==========
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-xl fade-in';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>

</html>

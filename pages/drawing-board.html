<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng tương tác EduRobot - Công cụ vẽ thông minh</title>
  <link rel="stylesheet" href="../css/drawing-board.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Custom styles for branding */
    .brand-title {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      background: #2563eb;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }
    .brand-text h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }
    .brand-text p {
      margin: 0;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Brand Logo & Title -->
  <div class="brand-title">
    <div class="brand-logo">E</div>
    <div class="brand-text">
      <h1>Bảng Vẽ Tương Tác</h1>
      <p>Hệ thống EduRobot 5.0</p>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="paint-canvas"></canvas>

    <!-- Nút gọi menu thu gọn/mở rộng -->
    <button class="toolbar-toggle-btn" id="toolbar-toggle" title="Ẩn/Hiện thanh công cụ">
      <!-- Icon Menu -->
      <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:24px;height:24px;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
      </</svg>
      <!-- Icon Close (Ẩn đi mặc định) -->
      <svg id="close-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:24px;height:24px; display:none;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </</svg>
    </button>

    <!-- Thanh công cụ (Floating Toolbar) -->
    <div class="drawing-toolbar" id="toolbar" style="left: 50%; bottom: 80px; transform: translateX(-50%);">
      <!-- Drag Handle -->
      <div class="toolbar-drag-handle" id="drag-handle" title="Kéo để di chuyển"></div>

      <!-- Chọn (Pointer) -->
      <button class="toolbar-btn" data-tool="select" title="Chọn & Di chuyển">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672ZM12 2.25V4.5m5.303.197-1.591 1.591M21.75 12h-2.25m-.197 5.303-1.591-1.591M12 21.75V19.5m-5.303-.197 1.591-1.591M2.25 12h2.25m-.197-5.303 1.591 1.591" />
        </svg>
      </button>

      <!-- Tẩy (Eraser) -->
      <button class="toolbar-btn" data-tool="eraser" title="Tẩy (Xóa đối tượng)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      </button>

      <div class="toolbar-divider"></div>

      <!-- Bút chì (Pencil) -->
      <button class="toolbar-btn active" data-tool="pencil" title="Bút chì">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
        </svg>
      </button>

      <!-- Bút Highlight (Highlighter) -->
      <button class="toolbar-btn" data-tool="highlight" title="Bút Highlight">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122l9.82-9.82a2.122 2.122 0 10-3-3l-9.82 9.82a2.122 2.122 0 00-.51 1.03l-1.002 4.004a.75.75 0 00.902.902l4.004-1.002a2.122 2.122 0 001.03-.51z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 14l3 3" />
        </svg>
      </button>

      <!-- Vẽ hình chữ nhật (Rectangle) -->
      <button class="toolbar-btn" data-tool="rect" title="Vẽ hình chữ nhật">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 0 1 7.5 5.25h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25v-9Z" />
        </svg>
      </button>

      <!-- Vẽ hình tròn (Circle) -->
      <button class="toolbar-btn" data-tool="circle" title="Vẽ hình tròn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" />
        </svg>
      </button>

      <!-- Vẽ đường thẳng (Line) -->
      <button class="toolbar-btn" data-tool="line" title="Vẽ đường thẳng">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15" />
        </svg>
      </button>

      <!-- Nhập Text -->
      <button class="toolbar-btn" data-tool="text" title="Nhập chữ">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21V3m8 0H2.5" />
        </svg>
      </button>

      <div class="toolbar-divider"></div>

      <!-- Chọn màu (Color Palette Popover Trigger) -->
      <button class="toolbar-btn" id="color-picker-trigger" title="Chọn màu sắc & độ dày nét">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122l9.82-9.82a2.122 2.122 0 10-3-3l-9.82 9.82a2.122 2.122 0 00-.51 1.03l-1.002 4.004a.75.75 0 00.902.902l4.004-1.002a2.122 2.122 0 001.03-.51zm0 0l-3 3m15.03-3.03l-3 3m-9.75-2.625c.162.298.396.55.688.732a3 3 0 11-4.225-4.225l1.62-1.623M16.5 12h-.008v.008H16.5V12Zm-.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0ZM13.5 13.5h-.008v.008H13.5v-.008Zm-.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0Z" />
        </svg>
        <!-- Popover bảng màu và độ dày nét -->
        <div class="color-picker-popover" id="color-popover">
          <div class="color-options">
            <div class="color-swatch active" style="background-color: #000000;" data-color="#000000"></div>
            <div class="color-swatch" style="background-color: #ef4444;" data-color="#ef4444"></div>
            <div class="color-swatch" style="background-color: #3b82f6;" data-color="#3b82f6"></div>
            <div class="color-swatch" style="background-color: #22c55e;" data-color="#22c55e"></div>
            <div class="color-swatch" style="background-color: #eab308;" data-color="#eab308"></div>
          </div>
          <div class="thickness-slider-container">
            <span id="thickness-val">4px</span>
            <input type="range" class="thickness-slider" id="thickness-range" min="2" max="20" value="4">
          </div>
        </div>
      </button>

      <!-- Undo -->
      <button class="toolbar-btn" id="undo-btn" title="Quay lại (Undo)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </svg>
      </button>

      <!-- Redo -->
      <button class="toolbar-btn" id="redo-btn" title="Làm lại (Redo)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m15 15 6-6m0 0-6-6m6 6H9a6 6 0 0 0 0 12h3" />
        </svg>
      </button>

      <!-- Xóa tất cả (Clear All) -->
      <button class="toolbar-btn" id="clear-all-btn" title="Xóa tất cả">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </button>
    </div>
  </div>

  <script src="../js/drawing-board.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const board = new DrawingBoard('paint-canvas', 'canvas-container');

      // Đăng ký sự kiện chọn công cụ vẽ
      const toolButtons = document.querySelectorAll('.toolbar-btn[data-tool]');
      toolButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          toolButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          board.setTool(btn.getAttribute('data-tool'));
        });
      });

      // Ẩn/Hiện thanh công cụ (Menu toggler)
      const toggleBtn = document.getElementById('toolbar-toggle');
      const toolbar = document.getElementById('toolbar');
      const menuIcon = document.getElementById('menu-icon');
      const closeIcon = document.getElementById('close-icon');

      toggleBtn.addEventListener('click', () => {
        const isCollapsed = toolbar.style.display === 'none';
        if (isCollapsed) {
          toolbar.style.display = 'flex';
          toggleBtn.classList.remove('active');
          menuIcon.style.display = 'block';
          closeIcon.style.display = 'none';
        } else {
          toolbar.style.display = 'none';
          toggleBtn.classList.add('active');
          menuIcon.style.display = 'none';
          closeIcon.style.display = 'block';
        }
      });

      // Điều khiển Popover chọn màu sắc
      const colorTrigger = document.getElementById('color-picker-trigger');
      const colorPopover = document.getElementById('color-popover');
      
      colorTrigger.addEventListener('click', (e) => {
        if (e.target.closest('.color-picker-popover')) return; // Không đóng khi chỉnh bên trong popover
        colorPopover.classList.toggle('show');
      });

      // Đóng popover khi nhấn ra ngoài
      document.addEventListener('click', (e) => {
        if (!colorTrigger.contains(e.target)) {
          colorPopover.classList.remove('show');
        }
      });

      // Chọn màu sắc
      const swatches = document.querySelectorAll('.color-swatch');
      swatches.forEach(swatch => {
        swatch.addEventListener('click', () => {
          swatches.forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          board.currentColor = swatch.getAttribute('data-color');
        });
      });

      // Điều chỉnh độ dày nét vẽ
      const thicknessRange = document.getElementById('thickness-range');
      const thicknessVal = document.getElementById('thickness-val');
      thicknessRange.addEventListener('input', (e) => {
        const val = e.target.value;
        thicknessVal.textContent = `${val}px`;
        board.currentThickness = parseInt(val, 10);
      });

      // Điều khiển nút hoàn tác & làm lại & xóa tất cả
      document.getElementById('undo-btn').addEventListener('click', () => board.undo());
      document.getElementById('redo-btn').addEventListener('click', () => board.redo());
      document.getElementById('clear-all-btn').addEventListener('click', () => board.clearAll());

      // Triển khai logic Kéo thả thanh công cụ nổi (Draggable) & Docking tự động
      const dragHandle = document.getElementById('drag-handle');
      let isDragging = false;
      let offsetX, offsetY;

      dragHandle.addEventListener('mousedown', (e) => {
        isDragging = true;
        // Loại bỏ docking class khi kéo thả thủ công
        toolbar.classList.remove('dock-top', 'dock-bottom', 'dock-left');
        offsetX = e.clientX - toolbar.offsetLeft;
        offsetY = e.clientY - toolbar.offsetTop;
        toolbar.style.transform = 'none'; // Bỏ transform dịch chuyển trung tâm
        toolbar.style.transition = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        let x = e.clientX - offsetX;
        let y = e.clientY - offsetY;
        
        // Giới hạn trong màn hình
        x = Math.max(10, Math.min(window.innerWidth - toolbar.offsetWidth - 10, x));
        y = Math.max(10, Math.min(window.innerHeight - toolbar.offsetHeight - 10, y));
        
        toolbar.style.left = `${x}px`;
        toolbar.style.top = `${y}px`;
        toolbar.style.bottom = 'auto';
      });

      document.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        toolbar.style.transition = 'transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease';
        
        // Hỗ trợ Docking tự động khi kéo sát viền
        const threshold = 50; // pixel ngưỡng docking
        const rect = toolbar.getBoundingClientRect();
        
        if (rect.top < threshold) {
          toolbar.classList.add('dock-top');
          toolbar.style.left = '50%';
          toolbar.style.top = '10px';
        } else if (window.innerHeight - rect.bottom < threshold) {
          toolbar.classList.add('dock-bottom');
          toolbar.style.left = '50%';
          toolbar.style.top = 'auto';
          toolbar.style.bottom = '10px';
        } else if (rect.left < threshold) {
          toolbar.classList.add('dock-left');
          toolbar.style.left = '10px';
          toolbar.style.top = '50%';
        }
      });
      
      // Hỗ trợ cảm ứng kéo thả trên điện thoại/máy tính bảng
      dragHandle.addEventListener('touchstart', (e) => {
        isDragging = true;
        toolbar.classList.remove('dock-top', 'dock-bottom', 'dock-left');
        const touch = e.touches[0];
        offsetX = touch.clientX - toolbar.getBoundingClientRect().left;
        offsetY = touch.clientY - toolbar.getBoundingClientRect().top;
        toolbar.style.transform = 'none';
        toolbar.style.transition = 'none';
      });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        let x = touch.clientX - offsetX;
        let y = touch.clientY - offsetY;
        
        x = Math.max(10, Math.min(window.innerWidth - toolbar.offsetWidth - 10, x));
        y = Math.max(10, Math.min(window.innerHeight - toolbar.offsetHeight - 10, y));
        
        toolbar.style.left = `${x}px`;
        toolbar.style.top = `${y}px`;
        toolbar.style.bottom = 'auto';
      });

      document.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
      });
    });
  </script>
</body>
</html>

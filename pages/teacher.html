<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng điều khiển Giáo viên - EduRobot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- SheetJS for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div id="login-screen"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-10 max-w-md w-full shadow-2xl text-center">
            <div class="w-20 h-20 bg-blue-100 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-6">👩‍🏫
            </div>
            <h2 class="text-3xl font-black text-gray-800 mb-2">Giáo viên</h2>
            <p class="text-gray-500 mb-8 font-bold text-sm uppercase tracking-widest">Đăng nhập để xem báo cáo</p>

            <div class="space-y-4">
                <div class="relative">
                    <input type="email" id="teacher-email" placeholder="Email (VD: teacher@gmail.com)..."
                        class="w-full px-6 py-4 rounded-2xl border-2 border-gray-100 focus:border-blue-500 transition-all outline-none font-bold text-center text-lg">
                </div>
                <div class="relative">
                    <input type="password" id="teacher-password" placeholder="Nhập mật khẩu truy cập..."
                        class="w-full px-6 py-4 rounded-2xl border-2 border-gray-100 focus:border-blue-500 transition-all outline-none font-bold text-center text-lg pr-14">
                    <button type="button" onclick="togglePasswordVisibility('teacher-password', this)" title="Hiện/Ẩn mật khẩu"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
                <button id="btn-login-go" onclick="checkLogin()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-200 transition-all transform active:scale-95 uppercase tracking-widest flex items-center justify-center gap-2">
                    Vào hệ thống
                </button>
            </div>
            <a href="../index.html"
                class="inline-block mt-8 text-sm font-bold text-gray-400 hover:text-blue-600 transition-colors uppercase tracking-widest">Quay
                lại trang chủ</a>
        </div>
    </div>

    <div id="dashboard" class="hidden container mx-auto space-y-8">
        <div id="teacher-header"></div>

        <script type="module">
            import { DashboardUI } from '../js/dashboard/dashboard-ui.js';
            
            // Khởi tạo Dashboard App cho Giáo viên
            DashboardUI.initDashboardApp({
                title: 'Bảng Điểm Tổng Hợp',
                subtitle: 'Theo dõi kết quả học tập của toàn khối',
                icon: '📊',
                iconBg: 'bg-blue-100',
                iconColor: 'text-blue-600',
                onReady: () => {
                    // Logic tải dữ liệu riêng của trang này
                    if (typeof loadStats === 'function') loadStats();
                }
            });

            // Gán các hàm vào window để các nút HTML có thể gọi
            window.loadStats = loadStats;
            window.exportToExcel = exportToExcel;
            window.togglePasswordVisibility = (id, el) => {
                const input = document.getElementById(id);
                if (input.type === 'password') {
                    input.type = 'text';
                    el.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>';
                } else {
                    input.type = 'password';
                    el.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>';
                }
            };
        </script>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-card p-8 rounded-[32px] border-l-8 border-blue-500">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Tổng số lượt làm bài</p>
                <h3 id="stat-total" class="text-4xl font-black text-gray-800">--</h3>
            </div>
            <div class="glass-card p-8 rounded-[32px] border-l-8 border-green-500">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Điểm trung bình</p>
                <h3 id="stat-avg" class="text-4xl font-black text-gray-800">--</h3>
            </div>
            <div class="glass-card p-8 rounded-[32px] border-l-8 border-orange-500">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Học sinh tích cực</p>
                <h3 id="stat-students" class="text-4xl font-black text-gray-800">--</h3>
            </div>
        </div>

        <!-- Recent Results Table -->
        <div class="glass-card rounded-[40px] overflow-hidden">
            <div
                class="p-8 border-b border-gray-100 bg-white/50 flex flex-col md:flex-row justify-between items-center gap-4">
                <h3 id="stats-title" class="text-xl font-black text-gray-800 uppercase tracking-tight">KẾT QUẢ HỌC TẬP
                </h3>
                <div class="flex flex-col md:flex-row gap-4 items-center w-full md:w-auto">
                    <div class="relative w-full md:w-72">
                        <select id="lesson-filter" onchange="loadStats()" title="Chọn bài học để xem"
                            class="w-full pl-4 pr-10 py-2 rounded-xl border-2 border-blue-100 focus:border-blue-500 outline-none font-bold text-gray-600 appearance-none bg-white cursor-pointer transition-all text-sm">
                            <option value="">Tất cả bài học</option>
                            <!-- Lessons will be loaded here -->
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-blue-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7">
                                </path>
                            </svg>
                        </div>
                    </div>
                    <span
                        class="px-3 py-1 bg-blue-100 text-blue-600 text-[10px] font-black rounded-lg uppercase whitespace-nowrap">Trắc
                        nghiệm</span>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50/50">
                            <th class="p-6 text-xs font-black text-gray-400 uppercase tracking-widest">STT</th>
                            <th class="p-6 text-xs font-black text-gray-400 uppercase tracking-widest">Học sinh</th>
                            <th class="p-6 text-xs font-black text-gray-400 uppercase tracking-widest">Lớp</th>
                            <th class="p-6 text-xs font-black text-gray-400 uppercase tracking-widest text-center">
                                Trường</th>
                            <th class="p-6 text-xs font-black text-gray-400 uppercase tracking-widest text-center">Điểm
                                số</th>
                            <th class="p-6 text-xs font-black text-gray-400 uppercase tracking-widest text-right">Ngày
                                nộp</th>
                        </tr>
                    </thead>
                    <tbody id="results-table" class="divide-y divide-gray-50">
                        <!-- Data rows here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/core/firebase-logic.js"></script>
    <script src="../js/core/floating-menu.js?v=1009"></script>
    <script>
        // Simple security
        async function checkLogin() {
            const email = document.getElementById('teacher-email').value.trim();
            const pass = document.getElementById('teacher-password').value;
            const btn = document.getElementById('btn-login-go');

            if (!email || !pass) {
                alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>⏳ Đang đăng nhập...</span>';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                // Lấy thông tin role và approval từ Firestore
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    throw new Error("Tài khoản không tồn tại trên hệ thống dữ liệu.");
                }

                const userData = userDoc.data();
                if (userData.role !== 'teacher' && userData.role !== 'admin') {
                    await auth.signOut();
                    alert("Tài khoản này không có quyền truy cập trang Giáo viên.");
                    return;
                }

                if (!userData.approved) {
                    await auth.signOut();
                    alert("Tài khoản của bạn đang chờ Admin duyệt. Vui lòng quay lại sau.");
                    return;
                }

                // Lưu vào localStorage để đồng bộ (giống auth.html)
                localStorage.setItem('userRole', userData.role);
                localStorage.setItem('userApproved', 'true');
                localStorage.setItem('teacherName', userData.displayName || userData.name || 'Giáo viên');
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadStats();
            } catch (error) {
                console.error(error);
                let msg = "Lỗi đăng nhập!";
                if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    msg = "Email hoặc mật khẩu không chính xác.";
                } else if (error.code === 'auth/invalid-email') {
                    msg = "Địa chỉ email không hợp lệ.";
                }
                alert(msg);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Vào hệ thống';
            }
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>';
            }
        }

        function logout() {
            localStorage.removeItem('userRole');
            localStorage.removeItem('teacherName');
            localStorage.removeItem('userApproved');
            window.location.reload();
        }

        let allQuizData = []; // Store for export

        // Populate Filter from Static Data (floating-menu.js)
        function populateLessonFilter() {
            const filter = document.getElementById('lesson-filter');
            filter.innerHTML = '<option value="">-- Chọn bài học để xem --</option>'; // Default empty

            // 1. Add "Load All" Option
            const allOpt = document.createElement('option');
            allOpt.value = "ALL";
            allOpt.innerText = "⚡ TẢI TẤT CẢ DỮ LIỆU (Có thể chậm)";
            allOpt.classList.add('font-bold', 'text-blue-600');
            filter.appendChild(allOpt);

            // 2. Manual Entries (Known mismatches or common items)
            const manualItems = [
                "Bài văn tả người (Tuần 22)",
                "Luyện tập về câu ghép (Tuần 21)",
                "Đoàn thuyền đánh cá (Tuần 22)"
            ];

            // 3. Extract from curriculumData
            const titles = new Set(manualItems);

            if (typeof curriculumData !== 'undefined') {
                for (const semester in curriculumData) {
                    curriculumData[semester].forEach(block => {
                        block.weeks.forEach(week => {
                            week.lessons.forEach(lesson => {
                                // Add lesson title
                                titles.add(lesson.title);
                                // Add section titles
                                if (lesson.sections) {
                                    lesson.sections.forEach(sec => titles.add(sec.title));
                                }
                            });
                        });
                    });
                }
            }

            // Sort and Append
            Array.from(titles).sort().forEach(title => {
                const opt = document.createElement('option');
                opt.value = title;
                opt.innerText = title;
                filter.appendChild(opt);
            });
        }

        async function loadStats() {
            const table = document.getElementById('results-table');
            const lessonFilter = document.getElementById('lesson-filter').value;

            // If nothing selected, don't load (or clear)
            if (!lessonFilter) {
                table.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-gray-400">Vui lòng chọn một bài học để xem kết quả.</td></tr>`;
                document.getElementById('stat-total').innerText = "--";
                document.getElementById('stat-avg').innerText = "--";
                document.getElementById('stat-students').innerText = "--";
                return;
            }

            table.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-gray-400 font-bold italic animate-pulse">Đang tải dữ liệu...</td></tr>`;

            try {
                let snapshot;

                // DATA FETCHING STRATEGY
                if (lessonFilter === "ALL") {
                    // Fetch ALL (Client-side sort)
                    snapshot = await db.collection("diem_tieng_viet_lop5").get();
                } else {
                    // Fetch SPECIFIC LESSON ONLY (Server-side Filter, No OrderBy)
                    // This is fast and efficient, fulfilling the user's request.
                    snapshot = await db.collection("diem_tieng_viet_lop5")
                        .where("lessonTitle", "==", lessonFilter)
                        .get();
                }

                let allDocs = [];
                // Process Snapshot
                snapshot.forEach(doc => {
                    allDocs.push(doc.data());
                });

                // Client-side Sort (Newest first)
                allDocs.sort((a, b) => {
                    const tA = a.timestamp ? a.timestamp.seconds : 0;
                    const tB = b.timestamp ? b.timestamp.seconds : 0;
                    return tB - tA;
                });

                // Unique Logic (Best Score per Student)
                const bestAttempts = {};
                allDocs.forEach((data) => {
                    const key = `${data.studentName}_${data.studentClass}`;
                    if (!bestAttempts[key]) {
                        bestAttempts[key] = data;
                    } else {
                        if ((data.score || 0) > (bestAttempts[key].score || 0)) {
                            bestAttempts[key] = data;
                        }
                    }
                });

                const uniqueData = Object.values(bestAttempts);

                // Sort Unique Data again
                uniqueData.sort((a, b) => {
                    const tA = a.timestamp ? a.timestamp.seconds : 0;
                    const tB = b.timestamp ? b.timestamp.seconds : 0;
                    return tB - tA;
                });

                // Update Global Data for Export
                allQuizData = uniqueData;

                // Calculate Stats
                let totalScore = 0;
                uniqueData.forEach(d => totalScore += (d.score || 0));

                let rows = "";
                document.getElementById('stats-title').innerText = (lessonFilter && lessonFilter !== "ALL") ? `KẾT QUẢ: ${lessonFilter.toUpperCase()}` : "TẤT CẢ BÀI HỌC";

                uniqueData.forEach((data, index) => {
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleString('vi-VN') : "---";
                    const scoreClass = data.score >= 80 ? 'text-green-600' : (data.score >= 50 ? 'text-orange-600' : 'text-red-600');

                    rows += `
                        <tr class="hover:bg-blue-50/30 transition-colors">
                            <td class="p-6 text-gray-400 font-bold text-sm">${index + 1}</td>
                            <td class="p-6">
                                <span class="font-black text-gray-800 block text-lg">${data.studentName || "N/A"}</span>
                                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest shrink-0">${data.studentSchool || "N/A"}</span>
                            </td>
                            <td class="p-6">
                                <span class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-lg font-black text-sm">${data.studentClass || "5/1"}</span>
                            </td>
                            <td class="p-6 font-bold text-center text-gray-600">${data.school || data.studentSchool || "N/A"}</td>
                            <td class="p-6">
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl font-black ${scoreClass}">${data.score || 0}</span>
                                    <span class="text-xs text-gray-400 font-bold">/ 100</span>
                                </div>
                            </td>
                            <td class="p-6 text-right text-sm font-bold text-gray-500">${date}</td>
                        </tr>
                    `;
                });

                table.innerHTML = rows || `<tr><td colspan="6" class="p-10 text-center text-gray-400">Chưa có kết quả nào cho bài học này.</td></tr>`;

                // Update Stats
                document.getElementById('stat-total').innerText = snapshot.size;
                document.getElementById('stat-avg').innerText = uniqueData.length > 0 ? (totalScore / uniqueData.length).toFixed(1) : "0";
                document.getElementById('stat-students').innerText = uniqueData.length;

            } catch (error) {
                console.error("Error loading stats:", error);
                table.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-red-500 font-black">Lỗi tải dữ liệu: ${error.message}</td></tr>`;
            }
        }

        async function exportToExcel() {
            try {
                const lessonFilter = document.getElementById('lesson-filter').value;

                // Use already filtered data from loadStats()
                const dataToExport = allQuizData.map((d, index) => ({
                    "STT": index + 1,
                    "Họ và Tên": d.studentName,
                    "Lớp": "'" + (d.studentClass || "N/A"),
                    "Trường": d.studentSchool || d.school || "N/A",
                    "Điểm (0-100)": d.score,
                    "Số câu đúng": d.correctCount || "N/A",
                    "Tổng số câu": d.totalQuestions || "N/A",
                    "Thời gian": d.timestamp ? d.timestamp.toDate().toLocaleString('vi-VN') : ""
                }));

                if (dataToExport.length === 0) {
                    alert("Chưa có dữ liệu để xuất!");
                    return;
                }

                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Kết quả Trắc nghiệm");

                const dateStr = new Date().toLocaleDateString('vi-VN').replace(/\//g, '-');
                const safeFilter = lessonFilter ? lessonFilter.replace(/[^a-zA-Z0-9]/g, '_') : 'Tat_Ca';
                const fileName = `Ket_Qua_Trac_Nghiem_${safeFilter}_${dateStr}.xlsx`;

                XLSX.writeFile(workbook, fileName);

            } catch (error) {
                console.error("Excel Export Error:", error);
                alert("Lỗi khi xuất file Excel!");
            }
        }
    </script>
</body>

</html>
